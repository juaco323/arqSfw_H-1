services:
  usuario-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: usuario_user
      POSTGRES_PASSWORD: usuario_secret
      POSTGRES_DB: usuario_db
    volumes:
      - usuario_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_user -d usuario_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private_net

  package-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: package_user
      POSTGRES_PASSWORD: package_secret
      POSTGRES_DB: package_db
    volumes:
      - package_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U package_user -d package_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private_net

  tracking-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tracking_user
      POSTGRES_PASSWORD: tracking_secret
      POSTGRES_DB: tracking_db
    volumes:
      - tracking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_user -d tracking_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - private_net

  usuario-service:
    build:
      context: ./services/usuario-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: usuario-db
      DB_PORT: "5432"
      DB_USER: usuario_user
      DB_PASSWORD: usuario_secret
      DB_NAME: usuario_db
    depends_on:
      usuario-db:
        condition: service_healthy
    networks:
      - private_net

  package-service:
    build:
      context: ./services/package-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: package-db
      DB_PORT: "5432"
      DB_USER: package_user
      DB_PASSWORD: package_secret
      DB_NAME: package_db
      USUARIO_SERVICE_URL: http://usuario-service:8000
      TRACKING_SERVICE_URL: http://tracking-service:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      package-db:
        condition: service_healthy
      usuario-service:
        condition: service_started
      tracking-service:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - private_net

  tracking-service:
    build:
      context: ./services/tracking-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: tracking-db
      DB_PORT: "5432"
      DB_USER: tracking_user
      DB_PASSWORD: tracking_secret
      DB_NAME: tracking_db
      PACKAGE_SERVICE_URL: http://package-service:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      tracking-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - private_net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    networks:
      - private_net

  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - usuario-service
      - package-service
      - tracking-service
    networks:
      - public_net
      - private_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - public_net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://tracking_user:tracking_secret@tracking-db:5432/tracking_db?sslmode=disable
    depends_on:
      tracking-db:
        condition: service_healthy
    networks:
      - private_net

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - usuario-service
      - package-service
      - tracking-service
      - notification-service
    networks:
      - private_net

  grafana:
    image: grafana/grafana:11.0.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - private_net

volumes:
  usuario_db_data:
  package_db_data:
  tracking_db_data:
  redis_data:
  grafana_data:

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true
