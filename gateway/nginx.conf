server {
    listen 80;
    server_name _;

    # Allow browser calls from frontend app running on a different origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"up","service":"api-gateway","message":"Use /health, /createUser, /createPackage, /updateStatus, /getTracking/{tracking_code}"}';
    }

    location /createUser {
        proxy_pass http://usuario-service:8000/createUser;
    }

    location /getUsers {
        proxy_pass http://usuario-service:8000/getUsers;
    }

    location /createPackage {
        proxy_pass http://package-service:8000/createPackage;
    }

    location /getAllPackages {
        proxy_pass http://package-service:8000/getAllPackages;
    }

    location /updateStatus {
        proxy_pass http://tracking-service:8000/updateStatus;
    }

    location /getTracking/ {
        proxy_pass http://tracking-service:8000/getTracking/;
    }

    location /health {
        proxy_pass http://usuario-service:8000/health;
    }

    location /metrics {
        proxy_pass http://usuario-service:8000/metrics;
    }
}
