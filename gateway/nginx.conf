server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $usuario_upstream http://usuario-service:8000;
    set $package_upstream http://package-service:8000;
    set $tracking_upstream http://tracking-service:8000;

    # Allow browser calls from frontend app running on a different origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"up","service":"api-gateway","message":"Use /health, /createUser, /createPackage, /updateStatus, /getTracking/{tracking_code}"}';
    }

    location /createUser {
        proxy_pass $usuario_upstream/createUser;
    }

    location /getUsers {
        proxy_pass $usuario_upstream/getUsers;
    }

    location /createPackage {
        proxy_pass $package_upstream/createPackage;
    }

    location /getAllPackages {
        proxy_pass $package_upstream/getAllPackages;
    }

    location /updateStatus {
        proxy_pass $tracking_upstream/updateStatus;
    }

    location ~ ^/getTracking/(.+)$ {
        proxy_pass $tracking_upstream/getTracking/$1;
    }

    location /health {
        proxy_pass $usuario_upstream/health;
    }

    location /metrics {
        proxy_pass $usuario_upstream/metrics;
    }
}
